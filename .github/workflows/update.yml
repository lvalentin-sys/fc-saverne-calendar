name: Mise à jour calendrier FC Saverne

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install chromium

      - name: Lire la FFF et générer l'iCal
        run: python update_calendar.py

      - name: Publier les changements
        run: |
          git config user.name "FC Saverne Calendar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/fc-saverne-s1.ics docs/matches.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Mise à jour calendrier FFF"
            git push
          fi
