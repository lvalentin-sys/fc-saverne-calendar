name: Mise Ã  jour calendrier FC Saverne

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: RÃ©cupÃ©rer le dÃ©pÃ´t
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Lire la FFF et gÃ©nÃ©rer l'iCal
        run: |
          python update_calendar.py
          FFF_URL="https://epreuves.fff.fr/competition/club/503964-f-c-saverne/equipe/2026_1975_SEM_2/resultat-calendrier" \
          CALENDAR_NAME="FC Saverne S2" \
          CALENDAR_SLUG="fc-saverne-s2" \
          OUT_ICS="docs/fc-saverne-s2.ics" \
          OUT_JSON="docs/matches-s2.json" \
          MIN_MATCHES="1" \
          python update_calendar.py
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}

      - name: Publier les changements
        run: |
          git config user.name "FC Saverne Calendar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/*.ics docs/*.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Mise Ã  jour calendrier FFF"
            git push
          fi
